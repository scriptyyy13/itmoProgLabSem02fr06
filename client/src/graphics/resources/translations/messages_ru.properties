# команда help
help.cmd.help=help - вывести справку по доступным командам
help.cmd.info=info - вывести информацию о коллекции
help.cmd.show=show - вывести все элементы коллекции
help.cmd.add=add - добавить новый элемент в коллекцию
help.cmd.update=update id - обновить значение элемента, id которого равен заданному
help.cmd.remove_by_id id - удалить элемент по id
help.cmd.clear=clear - очистить коллекцию
help.cmd.execute_script file_name - считать и исполнить скрипт из указанного файла
help.cmd.exit=exit - выйти из программы
help.cmd.remove_head=remove_head - вывести первый элемент коллекции и удалить его
help.cmd.add_if_max=add_if_max - добавить новый элемент в коллекцию, если его значение превышает значение наибольшего элемента этой коллекции
help.cmd.add_if_min=add_if_min - добавить новый элемент в коллекцию, если его значение меньше, чем у наименьшего элемента этой коллекции
help.cmd.average_of_age=average_of_age - вывести среднее значение поля age для всех элементов коллекции
help.cmd.filter_less_than_age age - вывести элементы, значение поля age которых меньше заданного
help.cmd.print_unique_weight=print_unique_weight - вывести уникальные значения поля weight всех элементов в коллекции
help.cmd.balancer_status=balancer_status - получить информацию о балансере и серверах
help.cmd.add_server=add_server - добавить сервер в балансер
help.cmd.remove_server=remove_server - удалить сервер из балансера

