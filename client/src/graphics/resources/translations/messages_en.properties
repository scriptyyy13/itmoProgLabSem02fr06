# команда help
help.cmd.help=help - display help for available commands
help.cmd.info=info - display information about the collection
help.cmd.show=show - display all elements of the collection
help.cmd.add=add - add a new element to the collection
help.cmd.update=update id - update the value of the element with the specified id
help.cmd.remove_by_id id - remove element by id
help.cmd.clear=clear - clear the collection
help.cmd.execute_script file_name - read and execute script from the specified file
help.cmd.exit=exit - exit the program
help.cmd.remove_head=remove_head - display the first element of the collection and remove it
help.cmd.add_if_max=add_if_max - add a new element to the collection if its value exceeds the value of the largest element in this collection
help.cmd.add_if_min=add_if_min - add a new element to the collection if its value is less than the value of the smallest element in this collection
help.cmd.average_of_age=average_of_age - display the average value of the age field for all elements in the collection
help.cmd.filter_less_than_age age - display elements whose age field value is less than specified
help.cmd.print_unique_weight=print_unique_weight - display unique values of the weight field for all elements in the collection
help.cmd.balancer_status=balancer_status - get information about the balancer and servers
help.cmd.add_server=add_server - add a server to the balancer
help.cmd.remove_server=remove_server - remove a server from the balancer

